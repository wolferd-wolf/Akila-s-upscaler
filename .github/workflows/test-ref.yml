name: Test reference implementation

on:
  push:
    paths:
      - 'ref/**'
  pull_request:
    paths:
      - 'ref/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ref/requirements.txt

      - name: Run tests
        run: |
          cd ref
          python -m pytest -v
